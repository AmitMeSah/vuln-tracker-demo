name: Refresh advisories
on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull KEV, CVE records and EPSS
        run: python feed/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "advisory-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data/advisories.json
          git diff --cached --quiet || (git commit -m "Refresh advisories" && git push)

